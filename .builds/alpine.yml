image: alpine/latest
packages:
  - uv
  - gcc
  - make
  - python3-dev

secrets:
  - b88a4c2c-944c-42a6-9fbb-7483049c458a

# playwright has no wheel for musl; see the e2e group in pyproject.toml.
environment:
  UV_NO_GROUP: e2e

sources:
  - git@git.sr.ht:~sfermigier/muchado

tasks:
  - install: |
      cd muchado
      # Not the payload's components: uv builds them from source, which is
      # the converter compiled in a container, hours, and CI has no engine.
      # The tiers that need them skip.
      uv sync --no-install-package libera-core --no-install-package libera-web
  - test: |
      cd muchado
      uv run --no-sync pytest -q --tb=short --ignore=tests/c_e2e
  - lint: |
      cd muchado
      uv run --no-sync ruff check
      uv run --no-sync ty check src
