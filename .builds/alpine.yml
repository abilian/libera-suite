image: alpine/latest
packages:
  - uv
  - gcc
  - python3-dev

secrets:
  - b88a4c2c-944c-42a6-9fbb-7483049c458a

# playwright has no wheel for musl; see the e2e group in pyproject.toml.
environment:
  UV_NO_GROUP: e2e

sources:
  - git@git.sr.ht:~sfermigier/muchado

tasks:
  - install: |
      cd muchado
      uv sync
  - test: |
      cd muchado
      uv run pytest -q --tb=short --ignore=tests/c_e2e
  - lint: |
      cd muchado
      uv run ruff check
      uv run ty check src
