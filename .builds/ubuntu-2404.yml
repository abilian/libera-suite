image: ubuntu/24.04

secrets:
  - b88a4c2c-944c-42a6-9fbb-7483049c458a

sources:
  - git@git.sr.ht:~sfermigier/muchado

packages:
  # Build tools
  - software-properties-common
  - build-essential
  # Python is 3.12
  - python3-dev
  - python3-pip
  # Extra
  - nodejs

tasks:
  - setup: |
      echo "Building on Ubuntu 2404"
      sudo pip install --break-system-packages -U uv nox
      cd muchado
      # Not the payload's components: uv builds them from source, which is
      # the converter compiled in a container, hours, and CI has no engine.
      # The tiers that need them skip.
      uv sync --no-install-package libera-core --no-install-package libera-web

  - test: |
      cd muchado
      uv run --no-sync pytest -q --tb=short
  - lint: |
      cd muchado
      uv run --no-sync ruff check
      # uv run --no-sync ty check src
  - nox: |
      cd muchado
      uvx nox -e tests-3.12 check
