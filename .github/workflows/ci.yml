name: CI (nox)

# **Disabled on purpose, and it has never worked.** It names a nox session that
# does not exist and a Python matrix down to 3.9 against `requires-python =
# ">=3.12"`, and a runner has neither an editor payload nor a browser, so the
# suite it would run is the third of it that needs neither. Verification happens
# on the laptop; see CLAUDE.md.
#
# Left in place rather than deleted because the shape is worth keeping for when
# there is something here worth running. Until then it fires only when somebody
# asks it to.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and nox
        run: pip install uv nox
      - name: Run checks (lint, format, typecheck)
        run: nox -s check -P 3.12

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv and nox
        run: pip install uv nox
      - name: Run tests
        run: nox -s test -p ${{ matrix.python-version }}
