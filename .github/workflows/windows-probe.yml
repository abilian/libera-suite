# Does any of this build on Windows?
#
# **Not a gate.** Nothing depends on it and a red result is information. The
# Linux workflow next door is disabled and has never worked; this one is here
# because nobody owns a Windows machine, and a hosted runner answers the cheap
# questions for nothing.
#
# Two stages run on every push that could affect them:
#
#   toolchain   what the runner has, and what build/toolchain.sh makes of it
#   fetch       clone the pinned sources and apply the patch queue
#
# `fetch` is the Windows-specific one and it is cheap. build/patches/ is a wire
# format whose context lines carry trailing whitespace, and a checkout with
# core.autocrlf on would rewrite every one of them.
#
# The third stage is hours and is asked for by hand:
#
#   configure   cmake, which drags in boost, ICU, OpenSSL and V8
#
# That one answers whether V8 8.9 builds under the runner's MSVC, which decides
# whether Windows is a project or an afternoon. It is off by default because a
# hosted runner throws its disk away, so a run that hits the six-hour limit
# gains nothing on a retry.
name: windows

on:
  push:
    # Only when something that could change the answer moves. A docs-only push
    # has no business spending twenty minutes cloning six repositories. Delete
    # these three lines to run it on everything.
    paths:
      - 'build/**'
      - '.github/workflows/windows-probe.yml'
  workflow_dispatch:
    inputs:
      configure:
        description: 'also run configure (hours: boost, ICU, OpenSSL, V8)'
        type: boolean
        default: false
      except:
        description: 'components to skip, comma separated. Empty means openssl; say none to skip nothing'
        type: string
        default: ''

# A second push should replace the first run, not queue behind twenty minutes
# of it.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash

    env:
      # build_3rdparty_common.run_command pipes both streams and, on failure,
      # reports stderr -- falling back to stdout only when stderr is empty. For
      # nmake that is exactly backwards: the banner and the fatal error go to
      # stderr, and every command it ran goes to stdout, so the half naming the
      # target is the half thrown away. Six rounds of this read one error with
      # no context. Patch 0023 makes the variable turn the pipes off.
      EO_3RDPARTY_VERBOSE: '1'

    steps:
      # PowerShell, not wmic: wmic is deprecated and already absent from newer
      # Windows images, so a report written with it would start failing on an
      # image bump and tell us nothing about the build.
      - name: What this machine is
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          '{0:N1} GB RAM' -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' |
            Select-Object DeviceID,
              @{n='FreeGB';e={'{0:N1}' -f ($_.FreeSpace / 1GB)}},
              @{n='SizeGB';e={'{0:N1}' -f ($_.Size / 1GB)}} | Format-Table

      # A full build tree is about 30 GB and the runners keep most of their
      # space on D:. Deep paths are the other Windows tax, since V8's checkout
      # is long enough to matter, so the root is one letter.
      - name: Choose a build root
        run: |
          if [ -d /d ]; then drive=d; else drive=c; fi
          mkdir -p "/$drive/b"
          echo "BUILD_ROOT=${drive^^}:/b" >> "$GITHUB_ENV"
          df -h "/$drive/b"

      # Before any clone, including the ones build.sh makes. git's Windows
      # default rewrites line endings on checkout, and build/patches/ does not
      # survive that: `git am --keep-cr` is applying a series whose context must
      # match byte for byte.
      - name: Stop git rewriting line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          # build.sh refuses to fetch without one, because a build records the
          # commit it came from. A runner has none.
          git config --global user.name 'windows probe'
          git config --global user.email 'probe@localhost'
          # core's tree is deep -- Common/3dParty/v8 and the rest -- and Git for
          # Windows still defaults to the 260-character limit. Without this a
          # clone fails partway through with "Filename too long", which reads
          # like a corrupt repository rather than a Windows setting.
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Git for Windows ships a trimmed perl, puts it first, and OpenSSL's
      # Configure needs a full one. Two things measured on the first run: the
      # runner has no Strawberry Perl to reorder to, and GITHUB_PATH does not
      # win against Git Bash anyway -- MSYS2 puts /usr/bin early whatever the
      # environment says. So install one and record where it is, rather than
      # arguing with PATH.
      #
      # choco, not winget: the images ship Chocolatey, and winget is usually
      # unusable in a non-interactive runner session. toolchain.sh still says
      # winget, which is the right answer for a person at a desktop.
      - name: A perl OpenSSL can use
        run: |
          usable() { [ -x "$1" ] && "$1" -MFindBin -MIPC::Cmd -e 'exit 0' 2>/dev/null; }
          found=""
          for p in /c/Strawberry/perl/bin/perl.exe /c/Perl64/bin/perl.exe; do
            usable "$p" && { found="$p"; break; }
          done
          if [ -z "$found" ]; then
            choco install strawberryperl -y --no-progress
            usable /c/Strawberry/perl/bin/perl.exe && found=/c/Strawberry/perl/bin/perl.exe
          fi
          [ -n "$found" ] || { echo "FATAL: no perl with FindBin and IPC::Cmd" >&2; exit 1; }
          echo "PERL_BIN=$(dirname "$found")" >> "$GITHUB_ENV"
          echo "using $found  ($("$found" -e 'print $^V'))"

      # ICU is built as Cygwin/MSVC -- upstream's design, not a workaround: the
      # shell and make come from Cygwin, the compiler is still MSVC. choco puts
      # it in C:\tools\cygwin rather than the C:\cygwin64 that nc-build.bat
      # defaults to, so CYGWIN_ROOT says where. `make` is a separate package;
      # a base Cygwin passes the path check and fails inside configure.
      - name: Cygwin, for ICU
        run: |
          choco install --yes --no-progress cygwin
          root='C:\tools\cygwin'
          root_u="$(cygpath -u "$root")"

          # Cygwin's own setup, not choco's cyg-get wrapper. choco installs
          # that as a .bat on a PATH this shell was started before, and says so
          # itself: "Environment Vars (like PATH) have changed. Close/reopen
          # your shell." The setup exe it copies into the root has no such
          # problem.
          setup="$(ls "$root_u"/*setup*.exe 2>/dev/null | head -1)"
          [ -n "$setup" ] || {
            echo "FATAL: no Cygwin setup exe in $root" >&2
            ls -1 "$root_u" | head -20 >&2
            exit 1
          }
          "$setup" --quiet-mode --no-shortcuts --no-startmenu --no-desktop \
            --root "$root" --local-package-dir "$(cygpath -w "$RUNNER_TEMP")" \
            --site http://mirrors.kernel.org/sourceware/cygwin/ \
            --packages make,python3

          # Neither is in Cygwin's base install, and neither failure is visible
          # until ICU's configure is already running: make builds it, python3
          # is spawned to generate data/rules.mk.
          #
          # Asked of Cygwin's bash: python3 in there is a Cygwin symlink, and
          # a `[ -x ]` from Git Bash calls it missing while it works.
          for tool in make python3; do
            "$root_u/bin/bash.exe" -lc "command -v $tool" || {
              echo "FATAL: Cygwin has no $tool after setup" >&2
              exit 1
            }
          done
          echo "CYGWIN_ROOT=$root" >> "$GITHUB_ENV"
          echo "cygwin: $root, $("$root_u/bin/make.exe" --version | head -1)"

      # Windows SDK 10.0.19041.0, because V8 8.9 pins it.
      #
      # build/toolchain/win/setup_toolchain.py:176 appends the version to its
      # own vcvarsall call, with a comment saying it does so "to avoid
      # accidentally building with a new and untested SDK". vcvarsall does not
      # object to a version that is absent: it emits LIB entries for it anyway,
      # so the failure surfaces 383 seconds later as `user32.lib is not found`
      # with a LIB list mixing 26100's ucrt and 19041's um.
      #
      # 2004 is the release name for build 19041.
      - name: The Windows SDK V8 pins
        run: |
          lib='C:/Program Files (x86)/Windows Kits/10/Lib/10.0.19041.0/um/x64/user32.lib'
          if [ ! -f "$lib" ]; then
            choco install --yes --no-progress windows-sdk-10-version-2004-all
          fi
          # Asserted on the file V8 actually looks for, not on choco's exit
          # code: the package can install and leave this absent, and then the
          # next three hundred seconds are wasted.
          [ -f "$lib" ] || {
            echo "FATAL: SDK 10.0.19041.0 has no um/x64/user32.lib" >&2
            ls -1 'C:/Program Files (x86)/Windows Kits/10/Lib' 2>&1 | sed 's/^/    /' >&2
            exit 1
          }
          echo "have $lib"

      # $PERL_BIN first, explicitly, in every step that runs the build scripts.
      # Repetitive on purpose: it is the only spelling that is deterministic
      # here, and one of these silently not applying is a perl fault twenty
      # minutes into OpenSSL.
      - name: toolchain
        run: |
          export PATH="$PERL_BIN:$PATH"
          # Both sides of the boundary. The recipes run through cmake, which
          # runs Python, which resolves tools with shutil.which -- so what bash
          # sees and what Python sees are two different questions, and OpenSSL's
          # Configure is invoked with the second one.
          echo "bash   perl:  $(command -v perl)"
          python -c "import shutil; print('python perl: ', shutil.which('perl'))"
          python -c "import shutil; print('python nmake:', shutil.which('nmake'))"
          python -c "import shutil; print('python cl:   ', shutil.which('cl'))"
          sh build/toolchain.sh check

      - name: fetch
        run: |
          export PATH="$PERL_BIN:$PATH"
          sh build/build.sh fetch

      # The patch queue is the reason the fetch stage is worth running on its
      # own: if the series applied, Windows has not mangled it.
      # `|| true` here would have shown a green tick for a queue that does not
      # apply, which is the one thing this stage exists to find out.
      # continue-on-error says the same thing honestly: red step, live job.
      - name: what the patch queue did
        continue-on-error: true
        run: |
          export PATH="$PERL_BIN:$PATH"
          sh build/check-patches.sh

      # An hour of V8, kept between runs.
      #
      # The runner throws its disk away, so every push rebuilt V8 from source:
      # 59 minutes before anything specific to this project was even attempted.
      # `install/` is the whole hour, because that is the tree ensure_dep reads
      # -- one empty ok_marker per component -- and also where core takes
      # harfbuzz, brotli and hunspell from as *source*. The work/ trees are
      # only needed to build them again.
      #
      # **Exact key, no restore-keys.** A near-match would hand the build a
      # tree from different pins or a different patch queue, and nothing
      # downstream checks: upstream's own cache key is the directory name plus
      # the platform, with no toolchain and no SHA in it, which is the same
      # shape as the payload.version fault behind the 0.1.0 release. A miss
      # costs an hour. A silent wrong answer costs a day.
      - name: Cache the third-party tree
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_ROOT }}/out/core/third_party/install
          # msvc-env.sh is in the hash because it carries the toolset
          # preference, and a tree built with one toolset must not be restored
          # into a build using another. The workflow file is deliberately NOT
          # in it: every edit here would then cost an hour of V8, which is the
          # thing this exists to avoid.
          key: 3rdparty-${{ runner.os }}-${{ hashFiles('build/pins.toml', 'build/patches/**', 'build/msvc-env.sh') }}

      # The third-party builder on its own, so one stuck component does not
      # hide the answer about the ones behind it.
      #
      # common.cmake hardcodes `--except=openssl-hash,icu-wasm` (plus cef,qt off
      # the desktop build) with no way to extend it. The builder itself takes
      # the list as an argument and is idempotent: each component writes an
      # ok_marker and is skipped next time. So calling it directly costs
      # nothing and skips what you name.
      #
      # `except: openssl` is what reaches V8 while OpenSSL is unsolved, and V8
      # is the question that decides whether Windows is a project or an
      # afternoon.
      # OpenSSL is skipped by DEFAULT, including on a push.
      #
      # It has taken nine rounds and answered none of them, and it is one
      # library. V8 8.9 is the question that decides whether Windows is worth a
      # machine, it sits directly behind OpenSSL in the build order, and it has
      # never once been reached. Waiting for a hand-dispatched run to ask it
      # has not worked, so the default asks it.
      #
      # `except: none` builds everything (no component is called that). The
      # configure step still runs afterwards and still walks into OpenSSL, so
      # its diagnostics keep arriving -- this reorders the questions, it does
      # not drop one.
      - name: third party, minus OpenSSL
        run: |
          export PATH="$PERL_BIN:$PATH"
          . build/msvc-env.sh && msvc_env
          skip="${{ inputs.except || 'openssl' }}"
          echo "==> building third party, skipping: $skip"
          python "$BUILD_ROOT/src/core/Common/3dParty/build_3rdparty.py" \
            "--except=openssl-hash,icu-wasm,cef,qt,$skip" \
            "$BUILD_ROOT/out/core/third_party/work" \
            "$BUILD_ROOT/out/core/third_party/install"

      - name: configure
        # if: inputs.configure
        run: |
          export PATH="$PERL_BIN:$PATH"
          sh build/build.sh configure

      # The question configure cannot answer.
      #
      # A green configure says every dependency resolved. It compiles nothing,
      # so it says nothing about vcpkg's OpenSSL 3.x against code written for
      # 1.1.1w. If that is going to break it breaks here, in xmlsec,
      # Common/Network or doctrenderer.
      - name: build
        run: |
          export PATH="$PERL_BIN:$PATH"
          sh build/build.sh build

      # Whether the binaries convert a document, which is a different question
      # from whether they linked.
      #
      # This project's house rule, and it has been earned: allfontsgen exits 0
      # having found zero fonts and writes a well-formed AllFonts.js, and x2t
      # infers its output format from the extension, so a wrong one writes a
      # blank document and exits 0. smoke.sh asserts on content -- text still
      # present after docx -> odt -> docx.
      #
      # The pdf stage, which is the one that exercises doctrenderer and sdkjs
      # inside V8, skips itself until a payload has been assembled and reports
      # `PASS (core only)`. That is the next thing to wire up, not a failure.
      - name: smoke
        run: |
          export PATH="$PERL_BIN:$PATH"
          sh build/smoke.sh

      - name: Keep the logs either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-probe-logs
          if-no-files-found: ignore
          retention-days: 14
          # Every log anywhere under the build tree, not the two directories
          # somebody guessed at: ICU's lands in
          # third_party/install/icu/icu-build.log, which the old two globs
          # missed entirely.
          # Logs, plus the makefiles the recipes generate: OpenSSL's Configure
          # writes one, and when nmake cannot make sense of it the makefile is
          # the evidence, not the log.
          path: |
            ${{ env.BUILD_ROOT }}/out/**/*.log
            ${{ env.BUILD_ROOT }}/out/**/makefile
