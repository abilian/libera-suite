# The converter: x2t, allfontsgen and their libraries, one wheel per platform,
# made by hatch_build.py; `lb components wheels` builds every platform's.
[project]
name = "libera-core"
# The payload version, which libera pins exactly; a test holds the three equal.
version = "0.7"
description = "Libera Suite's document converter, built from Euro-Office sources"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"

[project.urls]
Source = "https://github.com/abilian/libera-suite"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libera_core"]

[tool.hatch.build.targets.wheel.hooks.custom]

# What the build reads, so that uv builds it again when one changes, and only
# then.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "../../build/upstream/pins.toml" },
    { file = "../../build/upstream/patches/core/*.patch" },
    { file = "../../build/engine/*.sh" },
    { file = "../../build/src/libera_build/components.py" },
]
