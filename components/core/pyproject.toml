# The converter: x2t, allfontsgen and their libraries, one wheel per platform,
# made by hatch_build.py, and an sdist that builds it where there is no wheel;
# `lb components wheels` builds both on each platform.
[project]
name = "libera-core"
# The payload version, which libera pins exactly; a test holds the three equal.
version = "0.7"
description = "Libera Suite's document converter, built from Euro-Office sources"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"

[project.urls]
Source = "https://github.com/abilian/libera-suite"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libera_core"]

[tool.hatch.build.targets.wheel.hooks.custom]

# The sdist builds the core where there is no wheel, so it carries what the
# hook runs, at the paths it has in the repository: the pins, the patch
# queues, the build scripts and the tooling they need.
[tool.hatch.build.targets.sdist.force-include]
"../../build/upstream" = "build/upstream"
"../../build/engine" = "build/engine"
"../../build/docker" = "build/docker"
"../../build/windows" = "build/windows"
"../../build/src/libera_build" = "build/src/libera_build"
"../../src/libera/__init__.py" = "src/libera/__init__.py"
"../../src/libera/manifest.py" = "src/libera/manifest.py"
"../../src/libera/payload" = "src/libera/payload"

# What the build reads, so that uv builds it again when one changes, and only
# then.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "../../build/upstream/pins.toml" },
    { file = "../../build/upstream/patches/core/*.patch" },
    { file = "../../build/upstream/patches/libxml2/*.patch" },
    { file = "../../build/engine/*.sh" },
    { file = "../../build/src/libera_build/components.py" },
]
