# The editors, with the fonts they ship, the dictionaries and the blank
# documents: one wheel for every platform, built from the pinned sources by
# hatch_build.py, with libera-core's x2t for the slide themes.
[project]
name = "libera-web"
# The payload version, which libera pins exactly; a test holds the three equal.
version = "0.7.dev1"
description = "Libera Suite's editors, fonts and dictionaries, built from Euro-Office sources"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"

[project.urls]
Source = "https://github.com/abilian/libera-suite"

[build-system]
requires = ["hatchling>=1.27", "libera-core==0.7.dev1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libera_web"]

[tool.hatch.build.targets.wheel.hooks.custom]

# What the build reads, so that uv builds it again when one changes, and only
# then.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "../../build/upstream/pins.toml" },
    { file = "../../build/upstream/patches/sdkjs/*.patch" },
    { file = "../../build/upstream/patches/web-apps/*.patch" },
    { file = "../../build/engine/*.sh" },
    { file = "../../build/payload/**" },
    { file = "../../build/src/libera_build/components.py" },
]
