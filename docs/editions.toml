# What each edition of the site says in its own language, read by
# preprocess.py. The editions themselves are the [[project.extra.alternate]]
# entries in zensical.toml, English first.
#
# `nav` translates every label of zensical.toml's nav, English on the left.
# A label with no translation stops the build, so a new English page cannot
# reach another edition under an English title. Developers is translated but
# not its pages: that section is English-only, and in every other edition its
# tab links to it.
#
# `card_tagline` and `card_line` are the text of the edition's Open Graph card,
# the picture a shared link shows: cards.py draws them.
#
# The interface of Libera Suite itself is English in every edition (the editor
# is started with lang=en), so the pages keep its menu items in English. What
# the operating system says, SmartScreen or System Settings, they translate.

[en]
card_tagline = "Your documents, on your own machine."
card_line = "A free and open source office suite for Windows, macOS and Linux"
months = ["January", "February", "March", "April", "May", "June", "July",
          "August", "September", "October", "November", "December"]
date = "{day} {month} {year}"
news_title = "News"
news_intro = "The Libera Suite project posts its announcements here, newest first."
all_news = "All news"

