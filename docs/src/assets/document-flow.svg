<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="144.93" viewBox="0 0 760 144.93">
<title>How a document moves through Libera Suite</title><desc>x2t converts the document into the editor's working format; the editor appends changes to a log; saving merges both back through x2t into a real document.</desc><defs><marker id="arrowB5462B" viewBox="0 0 9 5.6" refX="9" refY="2.8" markerWidth="9" markerHeight="5.6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 9 2.8 L 0 5.6 Z" fill="#B5462B"/></marker></defs>
<rect x="0" y="0" width="760" height="144.93" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="18" y="18" width="202.67" height="70.71" rx="6" fill="#FFFFFF" stroke="#D9CFC0" stroke-width="1"/>
<text x="119.33" y="39.87" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E1A17" text-anchor="middle">Your document</text>
<text x="119.33" y="57.38" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6B6259" text-anchor="middle">.docx, .xlsx, .pptx</text>
<text x="119.33" y="73.8" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6B6259" text-anchor="middle">on your own disk</text>
<rect x="278.67" y="18" width="202.67" height="70.71" rx="6" fill="#F6F1E9" stroke="#D9CFC0" stroke-width="1"/>
<text x="380" y="39.87" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E1A17" text-anchor="middle">The editor's working copy</text>
<text x="380" y="57.38" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6B6259" text-anchor="middle">Editor.bin, and a log</text>
<text x="380" y="73.8" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6B6259" text-anchor="middle">of every change you make</text>
<rect x="539.33" y="18" width="202.67" height="70.71" rx="6" fill="#FFFFFF" stroke="#D9CFC0" stroke-width="1"/>
<text x="640.67" y="39.87" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1E1A17" text-anchor="middle">Your document, saved</text>
<text x="640.67" y="57.38" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6B6259" text-anchor="middle">written back in the</text>
<text x="640.67" y="73.8" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6B6259" text-anchor="middle">format you opened</text>
<text x="380" y="109.69" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#6B6259" text-anchor="middle">The editor reads the working copy and appends to the log. It never writes a document, which is why closing a window can save without asking it anything, and why a crash</text>
<text x="380" y="122.8" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#6B6259" text-anchor="middle">leaves something recoverable on disk.</text>
<path d="M 224.17 53.35 L 275.17 53.35" fill="none" stroke="#B5462B" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrowB5462B)"/>
<text x="249.67" y="47.35" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#B5462B" text-anchor="middle">x2t</text>
<path d="M 484.83 53.35 L 535.83 53.35" fill="none" stroke="#B5462B" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrowB5462B)"/>
<text x="510.33" y="47.35" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#B5462B" text-anchor="middle">x2t</text>
</svg>
