<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="299.96" viewBox="0 0 680 299.96">
<title>What runs where in Libera Suite</title><desc>The editor and an injected bridge run as web content in a window; the bridge talks over loopback HTTP to a Python host, which runs the x2t converter against files on your disk.</desc><defs><marker id="arrow6B6259" viewBox="0 0 9 5.6" refX="9" refY="2.8" markerWidth="9" markerHeight="5.6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 9 2.8 L 0 5.6 Z" fill="#6B6259"/></marker><marker id="arrowB5462B" viewBox="0 0 9 5.6" refX="9" refY="2.8" markerWidth="9" markerHeight="5.6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 9 2.8 L 0 5.6 Z" fill="#B5462B"/></marker></defs>
<rect x="0" y="0" width="680" height="299.96" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="18" y="18" width="644" height="113.2" rx="8" fill="#fcf9f8" stroke="#B5462B" stroke-width="1"/>
<text x="31" y="39.04" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#B5462B" text-anchor="start" letter-spacing="0.9">A WINDOW ON YOUR MACHINE</text>
<rect x="31" y="51.73" width="301" height="66.47" rx="6" fill="#FFFFFF" stroke="#D9CFC0" stroke-width="1"/>
<text x="181.5" y="72.13" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E1A17" text-anchor="middle">The editor</text>
<text x="181.5" y="88.73" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="400" fill="#6B6259" text-anchor="middle">upstream's web application,</text>
<text x="181.5" y="104.37" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="400" fill="#6B6259" text-anchor="middle">served from your own disk</text>
<rect x="348" y="51.73" width="301" height="66.47" rx="6" fill="#FFFFFF" stroke="#D9CFC0" stroke-width="1"/>
<text x="498.5" y="72.13" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E1A17" text-anchor="middle">The bridge</text>
<text x="498.5" y="88.73" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="400" fill="#6B6259" text-anchor="middle">window.AscDesktopEditor,</text>
<text x="498.5" y="104.37" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="400" fill="#6B6259" text-anchor="middle">three small JavaScript files</text>
<rect x="18" y="143.2" width="644" height="50.82" rx="6" fill="#F6F1E9" stroke="#D9CFC0" stroke-width="1"/>
<text x="340" y="163.6" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E1A17" text-anchor="middle">The host</text>
<text x="340" y="180.2" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="400" fill="#6B6259" text-anchor="middle">Python, answering on 127.0.0.1</text>
<rect x="18" y="206.02" width="314" height="50.82" rx="6" fill="#FFFFFF" stroke="#D9CFC0" stroke-width="1"/>
<text x="175" y="226.42" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E1A17" text-anchor="middle">x2t</text>
<text x="175" y="243.02" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="400" fill="#6B6259" text-anchor="middle">the converter</text>
<rect x="348" y="206.02" width="314" height="50.82" rx="6" fill="#FFFFFF" stroke="#D9CFC0" stroke-width="1"/>
<text x="505" y="226.42" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E1A17" text-anchor="middle">Your documents</text>
<text x="505" y="243.02" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="400" fill="#6B6259" text-anchor="middle">files on your own disk</text>
<text x="340" y="277.83" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#6B6259" text-anchor="middle">The editor is ordinary web content. Everything it cannot do in a browser, it asks the bridge, and the bridge asks the host.</text>
<path d="M 334 84.96 L 346 84.96" fill="none" stroke="#6B6259" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrow6B6259)"/>
<path d="M 340 131.2 L 340 143.2" fill="none" stroke="#B5462B" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrowB5462B)"/>
<text x="346" y="140.52" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#B5462B" text-anchor="start">HTTP</text>
<path d="M 175 194.02 L 175 206.02" fill="none" stroke="#6B6259" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arrow6B6259)"/>
<text x="181" y="203.35" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#6B6259" text-anchor="start">runs</text>
<path d="M 334 231.43 L 346 231.43" fill="none" stroke="#6B6259" stroke-width="1.4" stroke-linejoin="round" marker-start="url(#arrow6B6259)" marker-end="url(#arrow6B6259)"/>
</svg>
