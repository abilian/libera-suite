[project]
name = "libera"
version = "0.2.1"
description = "Libera Suite — Abilian's desktop office suite"
readme = "README.md"
authors = [
    { name = "Stefane Fermigier", email = "sf@abilian.com" }
]
requires-python = ">=3.12"
# This covers the host in src/libera/ and nothing else. The editor payload the
# host fetches at runtime is Euro-Office, which is AGPL-3.0, and its
# corresponding source is recorded in every payload manifest -- see
# docs/src/licence.md and `libera --payload-status`.
license = "Apache-2.0"
license-files = ["LICENSE"]
# No `License ::` classifier: PEP 639 deprecates them in favour of the SPDX
# expression above, and carrying both is how the two come to disagree.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X :: Cocoa",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "pywebview>=6.2.1",
]

# Only URLs that answer. `liberasuite.eu` does not resolve and the SourceHut
# mirror is not up under this name yet; a dead link in package metadata is
# worse than an absent one.
[project.urls]
Documentation = "https://docs.liberasuite.eu/"
Source = "https://github.com/abilian/libera-suite"
Issues = "https://github.com/abilian/libera-suite/issues"

[project.scripts]
libera = "libera:main"

# hatchling, and deliberately not uv_build, which this used until an install
# from source could not work anywhere.
#
# Homebrew's pip_install passes --no-binary=:all:, and pip applies that to build
# dependencies too. uv_build ships as a Rust binary -- one wheel per platform,
# no pure-Python path -- so the policy forbids the wheel and pip tries to
# compile it, which needs maturin, which needs compiling, which needs a Rust
# toolchain. `brew install libera` died there:
#
#     ERROR: Failed to build 'uv_build' when installing build dependencies
#
# It is not only Homebrew: a distribution packager, an air-gapped install, or
# anyone typing `pip install --no-binary :all: libera` hits the same wall, for a
# package that is pure Python and needs no compiler at all. hatchling and every
# dependency it builds with are pure Python, so the sdist builds with nothing
# but an interpreter. `uv build` and `uv sync` are unaffected: the backend is
# not the frontend.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
# manifest.json is generated by dist.sh and .gitignore'd, and hatchling leaves
# VCS-ignored files out by default -- which would ship a wheel that cannot say
# which payload it belongs to, silently, since the host requires an exact
# match. `artifacts` is the mechanism for a generated file, and unlike
# force-include it tolerates the file being absent, which it is on any machine
# that has not cut a release.
artifacts = ["src/libera/manifest.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/libera"]

# Scoped, because hatchling's default sdist is the whole working directory and
# uv_build's was src/ plus the metadata. Matching it keeps what ships the same,
# and avoids walking trees that are not ours to read: build/flatpak's
# flatpak-builder cache holds files owned by a subordinate uid after a rootless
# podman build, and the walk died on one of them with EPERM.
# only-include, not include: it bounds the walk as well as the result.
# hatchling's default sdist is the whole working directory, and this one carries
# a 439 MB flatpak-builder cache and 162 MB of built bundles under build/. The
# sdist wants none of it, the walk took minutes, and inside that cache are files
# a rootless podman build left owned by a subordinate uid, where it stopped with
# EPERM on someone's alsactl.pid. uv_build shipped src/ plus the metadata, so
# this ships the same.
[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "abilian-devtools>=0.9.4",
    "mypy>=2.3.1",
    "nox>=2026.8.17",
    "pre-commit>=4.6.2",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.6",
    "ty>=0.0.79",
    "zensical>=0.0.60",
]

[tool.mypy]
# The same stubs ty and pyrefly use. See stubs/README.md.
mypy_path = "stubs"

[tool.pyrefly]
# The same stubs ty uses. See stubs/README.md.
search-path = ["src", "stubs"]

[tool.ty.environment]
# stubs/ holds the pyobjc names the host uses -- see stubs/README.md for why
# this is a stub directory and not a rule turned off.
extra-paths = ["stubs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# conftest.py applies these by directory; registering them silences the warning.
markers = [
    "unit: fast and isolated",
    "integration: component interactions, file I/O",
    "e2e: full app or CLI workflows",
]

[tool.tepyd]
# Generated by `tepyd init` — review and adjust.
src_root = "src/libera"
src_package = "libera"
units = ["*", "*.py"]
# counter = "internal"   # or "cloc"

# Source units to exclude from analysis (a reason is required):
# [tool.tepyd.exclude]
# faker = "why this is not tested"

# Tiers, cheapest first. Add `expects = [...]` to a tier to scope it to
# the source units it should test (glob patterns over unit names); units
# outside the scope are reported n/a, not as gaps. Use it when layers map
# to tiers — e.g. integration `expects = ["repositories/*", "infra/*"]`,
# e2e `expects = ["web/*"]`. Omit it and the tier is checked against all.

[[tool.tepyd.tiers]]
name = "a_unit"
root = "tests/a_unit"
label = "unit"
target_share = 0.6

[[tool.tepyd.tiers]]
name = "b_integration"
root = "tests/b_integration"
label = "integration"
# The integration tier is the host over HTTP with a real payload behind it.
# gui, logs and payload have nothing to integrate: gui asks whether GTK is
# importable, logs configures a handler, and payload is exercised against real
# tarballs at the unit tier. Scoping this says "not applicable" rather than
# reporting three gaps that should never be filled.
expects = ["host"]

[[tool.tepyd.tiers]]
name = "c_e2e"
root = "tests/c_e2e"
label = "e2e"
# End to end means the shipped command or the editor in a browser, which is
# host and cli. Nothing else has an end to run to.
expects = ["host", "cli"]
