<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Libera Suite</title>
    <style>
      /* The editor's own tokens, by the editor's own names, copied from the
         :root block of the built web-apps CSS. Same names, so a real design
         system later has something to replace rather than two palettes to
         reconcile. test_the_start_page_uses_the_editors_own_palette keeps
         them honest against the payload.

         Light only, and deliberately: **the editor does not follow the system
         theme.** Measured -- it renders theme-light with --background-toolbar
         #f7f7f7 whether the OS is light or dark, and it persists a theme only
         once the user changes one. A prefers-color-scheme block here would
         show a dark start window beside a light editor, which is worse than
         no dark mode at all. When the editor's chosen theme becomes readable
         from here (same origin, but the key sits behind its own prefix), this
         should follow that instead; the dark values are .theme-dark in
         web-apps' app.css. */
      :root {
        color-scheme: light;
        --background-normal: #fff;
        --background-toolbar: #f7f7f7;
        --background-toolbar-additional: #efefef;
        --background-accent-button: #446995;
        --highlight-button-hover: #e0e0e0;
        --border-toolbar: #cbcbcb;
        --border-divider: #dfdfdf;
        --border-regular-control: #c0c0c0;
        --text-normal: rgba(0, 0, 0, 0.8);
        --text-secondary: rgba(0, 0, 0, 0.6);
        --text-tertiary: rgba(0, 0, 0, 0.4);
        --text-link: #445799;
        --canvas-background: #eee;
        /* web-apps' --border-radius-button-normal. The editor is square. */
        --radius: 2px;

        /* Ours, and deliberately not named like the editor's: nothing above
           this line is a decision we get to make, and nothing below it comes
           out of the payload. Palette A from the brand guide -- paper is the
           ground for anything that is not a tile, and only a tile carries
           colour. --libera-suite-pressed is the family colour darkened 6%,
           which is the least that keeps paper on it above 4.5:1 (measured
           6.05:1; undarkened it is 4.82:1 and already passes, so this is
           headroom for the pressed state rather than a fix). */
        --libera-paper: #f6f1e9;
        --libera-suite: #b5462b;
        --libera-suite-pressed: #9c3c25;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        /* web-apps' own stack, not the system UI font: this window sits beside
           the editor and should not look like a different application. */
        font: 12px/1.5 Arial, Helvetica, "Helvetica Neue", sans-serif;
        color: var(--text-normal);
        background: var(--canvas-background);
        -webkit-user-select: none;
        user-select: none;
      }
      /* The editor's toolbar strip, in the one form this window needs it --
         with one band of Libera colour along its top edge. A band and not a
         panel: this window sits beside the editor, and a start screen painted
         terracotta beside a document painted the editor's grey reads as two
         applications. The tiles on the buttons do the rest of the telling. */
      header {
        background: var(--background-toolbar);
        border-top: 4px solid var(--libera-suite);
        border-bottom: 1px solid var(--border-toolbar);
        padding: 14px 20px;
      }
      /* The wordmark, drawn, rather than "Libera Suite" set in Arial. The
         letters are outlines, so this needs no font and looks the same on
         every platform -- which is the reason the brand ships them that way. */
      header h1 { margin: 0; line-height: 0; }
      header h1 svg { display: block; height: 22px; width: auto; }
      header p { margin: 9px 0 0; color: var(--text-secondary); }
      main { padding: 20px; }
      h2 {
        font-size: 11px;
        font-weight: bold;
        color: var(--text-secondary);
        margin: 20px 0 8px;
      }
      main > h2:first-child { margin-top: 0; }
      .new { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        font: inherit;
        color: var(--text-normal);
        background: var(--background-normal);
        border: 1px solid var(--border-regular-control);
        border-radius: var(--radius);
        padding: 9px 12px;
        cursor: pointer;
        text-align: left;
      }
      button:hover { background: var(--highlight-button-hover); }
      button:focus-visible { outline: 2px solid var(--libera-suite); outline-offset: 1px; }
      button:disabled { opacity: 0.4; cursor: default; background: var(--background-normal); }
      .new button { flex: 1 1 140px; display: flex; align-items: center; gap: 10px; }
      /* 28px, so the glyph in the crook is still a glyph: the brand drops to a
         mark without one below 32, and these are the only marks in the window
         that have to say which editor rather than which product. */
      .tile { flex: 0 0 auto; width: 28px; height: 28px; }
      .new .kind { display: block; font-weight: bold; }
      .new .ext { display: block; color: var(--text-tertiary); }
      .wide { width: 100%; }
      /* The one filled button in the window. Open is what this window is for
         when the Recent list is empty, which is every first run. */
      #open {
        color: var(--libera-paper);
        background: var(--libera-suite);
        border-color: var(--libera-suite);
      }
      #open:hover { background: var(--libera-suite-pressed); }
      /* :disabled above resets every button to the plain background, because
         :hover still applies to a disabled button and would otherwise light it
         up. This one has a background of its own to keep; opacity does the
         disabling. */
      #open:disabled, #open:disabled:hover { background: var(--libera-suite); }
      ul { list-style: none; margin: 0; padding: 0; }
      li + li { margin-top: 4px; }
      .recent { width: 100%; display: flex; align-items: baseline; gap: 12px; }
      .recent .name { flex: 0 0 auto; white-space: nowrap; }
      /* The containing folder, not the whole path: a path reversed with
         direction:rtl to truncate on the left puts its leading slash at the
         far end, which reads as a trailing one. Right-truncating the folder
         has no such trick in it, and the file name is already beside it. */
      .recent .where { flex: 1 1 auto; min-width: 0; text-align: right;
        color: var(--text-tertiary); overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
      .empty { color: var(--text-tertiary); }
      .problem {
        margin: 16px 0 0;
        padding: 9px 12px;
        border: 1px solid var(--border-regular-control);
        border-radius: var(--radius);
        background: var(--background-normal);
      }
      footer {
        margin: 20px 20px 0;
        padding: 12px 0 20px;
        border-top: 1px solid var(--border-divider);
        color: var(--text-secondary);
      }
      footer dl { display: grid; grid-template-columns: max-content 1fr;
        gap: 2px 14px; margin: 0; }
      footer dt { color: var(--text-tertiary); }
      footer dd { margin: 0; overflow-wrap: anywhere; }
      a { color: var(--text-link); }
    </style>
  </head>
  <body>
    <!-- The brand marks, drawn once each. The L is the same path in all
         three tiles, so it is defined once and used; what differs is the
         ground colour and the glyph in the crook, which is the whole idea
         of the mark. Copied from brand/svg/ in the branding repository,
         which is where they are drawn -- do not edit them here.

         Inline rather than fetched: the host serves no static files at
         all, and a kilobyte of markup is a smaller thing to carry than a
         route, a content type and a path that has to stay inside a
         directory. -->

      <symbol id="tile-tables" viewBox="10 10 80 80">

        <use href="#tile-l" fill="#F6F1E9"/>
        <rect x="52" y="28" width="11" height="11" rx="2" fill="#F6F1E9"/>

      <symbol id="tile-slides" viewBox="10 10 80 80">
        <rect x="10" y="10" width="80" height="80" rx="18" fill="#A28137"/>
        <use href="#tile-l" fill="#F6F1E9"/>

        <rect x="52" y="49" width="14" height="4" rx="2" fill="#F6F1E9"/>

    </svg>

8 87.6504Q259.7504 87.186 258.9248 86.44640000000001Q258.0992 85.7068 257.59180000000003 84.5974Q257.0844 83.488 257.0844 81.854Q257.0844 80.5468 257.59180000000003 79.32560000000001Q258.0992 78.1044 259.071 77.1584Q260.0428 76.2124 261.46180000000004 75.6448Q262.8808 75.0772 264.7212 75.0772Q266.78520000000003 75.0772 268.47940000000006 75.7308Q270.1736 76.3844 271.4636 77.6228Z M293.7892 97.3512Q295.32 97.3512 296.524 96.8352Q297.728 96.3192 298.56219999999996 95.3904Q299.39639999999997 94.4616 299.835 93.17160000000001Q300.2736 91.8816 300.2736 90.3336V75.3524H303.5932V90.3336Q303.5932 92.4664 302.91380000000004 94.2896Q302.2344 96.1128 300.9702 97.44579999999999Q299.706 98.7788 297.8828 99.5356Q296.0596 100.2924 293.7892 100.2924Q291.5188 100.2924 289.6956 99.5356Q287.87239999999997 98.7788 286.5996 97.44579999999999Q285.3268 96.1128 284.6474 94.2896Q283.968 92.4664 283.968 90.3336V75.3524H287.2876V90.3164Q287.2876 91.8644 287.7262 93.15440000000001Q288.1648 94.4444 288.999 95.3732Q289.8332 96.302 291.0458 96.82660000000001Q292.2584 97.3512 293.7892 97.3512Z M320.48359999999997 100.0H317.1468V75.3524H320.48359999999997Z M351.01359999999994 78.156H343.03279999999995V100.0H339.7132V78.156H331.7152V75.3524H351.01359999999994Z M377.43279999999993 97.2824 377.4155999999999 100.0H362.22799999999995V75.3524H377.4155999999999V78.07H365.56479999999993V86.2572H375.16239999999993V88.8716H365.56479999999993V97.2824Z" fill="#8A7F76"/></svg></h1>
      <p>Your documents, on your own machine.</p>
    </header>
    <main>
      <h2>New</h2>
      <div class="new" id="new"></div>

      <h2>Open</h2>
      <button class="wide" id="open">Open a document…</button>

      <h2>Recent</h2>
      <ul id="recent">
        <li class="empty">Nothing yet.</li>
      </ul>

      <p class="problem" id="problem" hidden></p>

    </main>
    <footer>
      <dl id="payload"></dl>
    </footer>

    <script>
      // Every request goes through here, and this is where !ok becomes a
      // throw. fetch resolves for 404 and 500 -- only a network error rejects
      // -- so a caller that forgets to check the status sees success. Making
      // the one helper throw means there is nothing left to forget: the page
      // has no other way to reach the host.
      const host = async (path, body) => {
        const response = await fetch(
          "/__host__/" + path,
          body === undefined ? {} : { method: "POST", body },
        );
        if (!response.ok) {
          throw new Error(`the host answered ${response.status}`);
        }
        return response;
      };

      const buttons = (disabled) => {
        for (const b of document.querySelectorAll("button")) b.disabled = disabled;
      };

      const problem = (text) => {
        const box = document.getElementById("problem");
        box.textContent = text;
        box.hidden = false;
      };

      // Anything that opens a document ends this window: the host closes it
      // once the document window is up, so there is nothing to do here but
      // stop the user clicking twice while that happens.
      //
      // And put everything back if it does not happen: a start window left
      // disabled is one that is still on screen and takes no clicks at all,
      // which is how this was found. host() throws on a bad status so that
      // this catch is reached.
      let leaving = false;
      const once = (fn) => async (...args) => {
        if (leaving) return;
        leaving = true;
        buttons(true);
        try {
          await fn(...args);
        } catch (e) {
          leaving = false;
          buttons(false);
          problem(`That did not work: ${e.message || e}`);
        }
      };

      // Each section on its own: a start window with no recent list is still
      // a start window, and one that renders nothing because the third fetch
      // failed is not.
      const section = async (what, fill) => {
        try {
          await fill();
        } catch (e) {
          problem(`Could not load ${what}: ${e.message || e}`);
        }
      };

      const json = async (path) => (await host(path)).json();

      async function loadNew() {
        const apps = await json("apps");
        const box = document.getElementById("new");
        for (const app of apps) {
          if (!app.creates) continue;
          const button = document.createElement("button");
          // The tile is keyed by the editor's own name, so an editor that
          // gains a File > New without gaining a tile draws an empty square
          // and says nothing about it. test_every_new_button_has_a_tile_to_draw
          // is what notices; there is nothing useful this page could do here.
          button.innerHTML =
            '<svg class="tile" aria-hidden="true"><use /></svg>' +
            '<span><span class="kind"></span><span class="ext"></span></span>';
          button.querySelector("use").setAttribute("href", "#tile-" + app.name);
          button.querySelector(".kind").textContent = app.kind;
          button.querySelector(".ext").textContent = "." + app.ext;
          button.onclick = once(() => host("new?type=" + app.doctype, ""));
          box.append(button);
        }

      }

      async function loadRecent() {
        const recents = await json("recents");
        const list = document.getElementById("recent");
        if (recents.length) {
          list.replaceChildren(
            ...recents.slice(0, 10).map((entry) => {
              const item = document.createElement("li");
              const button = document.createElement("button");
              button.className = "recent";
              const parts = entry.path.split("/");
              const name = document.createElement("span");
              name.className = "name";
              name.textContent = parts.pop();
              const where = document.createElement("span");
              where.className = "where";
              where.textContent = parts.join("/") || "/";
              button.append(name, where);
              button.onclick = once(() =>
                host("open-recent", JSON.stringify({ id: entry.id })),
              );
              item.append(button);
              return item;
            }),
          );
        }

      }

      async function loadPayload() {
        const info = await json("payload");
        const rows = [
          ["Payload", info.version || "unknown"],
          ["Found via", info.origin || "—"],
          ["Platform", info.platform || "—"],
          ["Location", info.root || "—"],
        ];
        document.getElementById("payload").replaceChildren(
          ...rows.flatMap(([label, value]) => {
            const dt = document.createElement("dt");
            dt.textContent = label;
            const dd = document.createElement("dd");
            dd.textContent = value;
            return [dt, dd];
          }),
        );
      }

      document.getElementById("open").onclick = once(() =>
        host("open-document", ""),
      );
      section("the editors", loadNew);
      section("your recent documents", loadRecent);
      section("the payload", loadPayload);
    </script>
  </body>
</html>
